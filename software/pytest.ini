[pytest]
testpaths = tests
norecursedirs = baseline .venv output logs .git
markers =
    unit: small fixtures, no production RAW or reference process
    integration: software interface composition
    golden: existing frozen real evidence, no detection computation
    real_engine: explicitly authorized expensive real RAW detection
    repository: formal storage and historical query contracts
    security: path, hash, sentinel and tampering checks
    slow: reads larger protected real evidence
    release_gate: release decision and fail-closed checks
    reference_probe: original tiny sentinel/import probes, not a production engine run
